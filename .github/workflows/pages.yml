name: pages

# Publishes frontend/site/ (landing page, crop calendar) and backend/data/ to GitHub Pages.
on:
  push:
    branches: [main]
    paths: ["frontend/site/**", "backend/data/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: ./frontend/site/build.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/site/_site
      - id: deployment
        uses: actions/deploy-pages@v4
