name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", "render.yaml", "!backend/assistant/**", "!backend/agent/**", "!backend/knowledge/**", "!backend/data/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "render.yaml", "!backend/assistant/**", "!backend/agent/**", "!backend/knowledge/**", "!backend/data/**", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Every backend service keeps its own requirements.txt and tests/ folder.
      # assistant/ and agent/ have their own workflows, so they are skipped here.
      - name: Run tests for each service
        run: |
          set -e
          for dir in backend/*/; do
            case "$dir" in backend/assistant/|backend/agent/) continue ;; esac
            if [ -d "$dir/tests" ]; then
              echo "::group::$dir"
              python -m venv "/tmp/venv-$(basename "$dir")"
              . "/tmp/venv-$(basename "$dir")/bin/activate"
              pip install -q -r "$dir/requirements.txt" pytest
              (cd "$dir" && python -m pytest -q)
              deactivate
              echo "::endgroup::"
            fi
          done
