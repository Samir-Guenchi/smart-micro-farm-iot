name: Bug
description: Something is broken or behaves wrongly
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      placeholder: |
        1. ...
        2. ...
  - type: dropdown
    id: part
    attributes:
      label: Part of the system
      options:
        - Firmware / hardware
        - Backend (MQTT, database, API, alerts)
        - Web dashboard
        - Landing page / crop calendar
        - Assistant / agent
        - Docs / data
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove passwords and tokens before pasting.
      render: shell
