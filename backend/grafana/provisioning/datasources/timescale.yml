apiVersion: 1
datasources:
  - name: TimescaleDB
    uid: timescale
    type: grafana-postgresql-datasource
    url: db:5432
    user: ${POSTGRES_USER}
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      timescaledb: true
      postgresVersion: 1600
    isDefault: true
