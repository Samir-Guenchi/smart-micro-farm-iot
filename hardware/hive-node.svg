<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="800" viewBox="0 0 1120 800" role="img" aria-labelledby="title desc">
  <title id="title">Hive weighing and battery node reference wiring</title>
  <desc id="desc">Generic esp32dev reference. Load cell E+, E-, A+, and A- connect only to the corresponding HX711 terminals. HX711 DOUT and SCK connect to GPIO32 and GPIO33; HX711 VCC and GND connect to 3V3 and shared ground. SHT31 uses GPIO21 and GPIO22. Two 100 kilo-ohm resistors divide a single-cell battery no higher than 4.2 volts, with midpoint to GPIO34 and battery negative to shared ground.</desc>
  <defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b3a}.title{font-size:27px;font-weight:700}.sub{font-size:16px;fill:#405568}.label{font-size:17px;font-weight:600}.small{font-size:14px}.tiny{font-size:12px}.box{fill:#f5f8fb;stroke:#38536b;stroke-width:2}.dev{fill:#fff;stroke:#54738d;stroke-width:2}.wire{fill:none;stroke:#246b9a;stroke-width:3}.pwr{fill:none;stroke:#b64b35;stroke-width:3}.gnd{fill:none;stroke:#525b63;stroke-width:3}.warn{fill:#fff4e4;stroke:#bd6c19;stroke-width:2}</style></defs>
  <rect width="1120" height="800" fill="#fff"/><text x="40" y="48" class="title">Hive weighing and battery node · reference wiring</text><text x="40" y="78" class="sub">Generic esp32dev only · 3.3 V GPIO logic · verify exact board revision before wiring</text>
  <rect x="45" y="155" width="245" height="245" rx="10" class="dev"/><text x="167" y="190" text-anchor="middle" class="label">Load cell</text>
  <text x="70" y="240" class="small">E+ · excitation +</text><text x="70" y="285" class="small">E− · excitation −</text><text x="70" y="330" class="small">A+ · channel A +</text><text x="70" y="375" class="small">A− · channel A −</text>
  <rect x="350" y="155" width="260" height="350" rx="10" class="box"/><text x="480" y="190" text-anchor="middle" class="label">HX711 module</text>
  <text x="370" y="240" class="small">E+</text><text x="370" y="285" class="small">E−</text><text x="370" y="330" class="small">A+</text><text x="370" y="375" class="small">A−</text>
  <text x="510" y="240" class="small">DOUT</text><text x="510" y="285" class="small">SCK</text><text x="510" y="330" class="small">VCC</text><text x="510" y="375" class="small">GND</text>
  <path d="M290 240 H350" class="pwr"/><path d="M290 285 H350" class="gnd"/><path d="M290 330 H350" class="wire"/><path d="M290 375 H350" class="wire"/>
  <rect x="760" y="155" width="320" height="390" rx="10" class="box"/><text x="920" y="190" text-anchor="middle" class="label">ESP32 dev board</text>
  <text x="785" y="240" class="small">GPIO32</text><text x="785" y="285" class="small">GPIO33</text><text x="785" y="360" class="small">GPIO21 / SDA</text><text x="785" y="405" class="small">GPIO22 / SCL</text><text x="785" y="470" class="small">GPIO34 / ADC34</text><text x="785" y="515" class="small">3V3 · GND</text>
  <path d="M610 240 H760" class="wire"/><path d="M610 285 H760" class="wire"/><text x="645" y="229" class="tiny">DOUT → GPIO32</text><text x="645" y="274" class="tiny">SCK → GPIO33</text>
  <path d="M610 330 H690 V515 H760" class="pwr"/><text x="635" y="320" class="tiny">VCC → 3V3*</text><path d="M610 375 H710 V530 H760" class="gnd"/><text x="635" y="365" class="tiny">GND → shared ground</text>
  <rect x="820" y="565" width="240" height="85" rx="10" class="dev"/><text x="940" y="598" text-anchor="middle" class="label">SHT31 module</text><text x="940" y="625" text-anchor="middle" class="small">SDA → GPIO21 · SCL → GPIO22</text>
  <path d="M840 515 V575 H820" class="pwr"/><path d="M760 530 H900 V565" class="gnd"/><path d="M760 360 H740 V590 H820" class="wire"/><path d="M760 405 H720 V610 H820" class="wire"/>
  <rect x="45" y="465" width="610" height="225" rx="10" class="warn"/><text x="70" y="500" class="label">Battery divider · single cell, maximum 4.2 V only</text>
  <text x="70" y="555" class="small">Battery +</text><path d="M145 550 H205" class="pwr"/><rect x="205" y="530" width="100" height="40" rx="4" class="dev"/><text x="255" y="556" text-anchor="middle" class="small">100 kΩ</text><path d="M305 550 H365" class="wire"/><circle cx="365" cy="550" r="5" fill="#246b9a"/><path d="M365 550 H690 V470 H760" class="wire"/><text x="380" y="545" class="tiny">midpoint → GPIO34 / ADC34</text>
  <path d="M365 550 V610" class="wire"/><rect x="315" y="610" width="100" height="40" rx="4" class="dev"/><text x="365" y="636" text-anchor="middle" class="small">100 kΩ</text><path d="M365 650 V675 H145" class="gnd"/><text x="70" y="680" class="small">Battery − → shared GND / ESP32 GND reference</text>
  <path d="M145 675 H710 V530 H760" class="gnd"/><text x="70" y="720" class="small">Ratio 2.0. Other pack voltages require recalculating hardware and firmware.</text>
  <text x="70" y="750" class="tiny">*Power HX711 only at a supply supported by the actual module; shared low-voltage ground is required for ADC measurement.</text>
  <text x="40" y="785" class="tiny">Confirm load-cell wire colors by datasheet; color conventions vary. Keep GPIO signals at 3.3 V.</text>
</svg>
