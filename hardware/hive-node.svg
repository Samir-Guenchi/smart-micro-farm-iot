<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc">
  <title id="title">Hive weighing and battery node reference wiring</title>
  <desc id="desc">Generic esp32dev reference. Load cell excitation positive and negative connect to HX711 E+ and E-, and channel A positive and negative connect to A+ and A-. HX711 DOUT and SCK connect to GPIO32 and GPIO33. SHT31 I2C uses GPIO21 and GPIO22. A single-cell battery no higher than 4.2 volts uses two 100 kilo-ohm resistors in a ratio-two divider, midpoint to GPIO34 ADC34.</desc>
  <defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b3a}.title{font-size:27px;font-weight:700}.sub{font-size:16px;fill:#405568}.label{font-size:17px;font-weight:600}.small{font-size:14px}.tiny{font-size:12px}.box{fill:#f5f8fb;stroke:#38536b;stroke-width:2}.dev{fill:#fff;stroke:#54738d;stroke-width:2}.wire{fill:none;stroke:#246b9a;stroke-width:3}.pwr{fill:none;stroke:#b64b35;stroke-width:3}.gnd{fill:none;stroke:#525b63;stroke-width:3}.warn{fill:#fff4e4;stroke:#bd6c19;stroke-width:2}</style></defs>
  <rect width="1120" height="760" fill="#fff"/><text x="40" y="48" class="title">Hive weighing and battery node · reference wiring</text><text x="40" y="78" class="sub">Generic esp32dev only · 3.3 V GPIO logic · verify exact board revision before wiring</text>
  <rect x="420" y="160" width="310" height="380" rx="12" class="box"/><text x="575" y="198" text-anchor="middle" class="label">ESP32 dev board</text><text x="445" y="265" class="label">GPIO32 · HX711 DOUT</text><text x="445" y="305" class="label">GPIO33 · HX711 SCK</text><text x="445" y="365" class="label">GPIO21 · SDA</text><text x="445" y="405" class="label">GPIO22 · SCL</text><text x="445" y="470" class="label">GPIO34 / ADC34</text><text x="445" y="510" class="small">3V3 · GND</text>
  <rect x="70" y="205" width="225" height="250" rx="10" class="dev"/><text x="182" y="238" text-anchor="middle" class="label">Load cell</text><text x="95" y="280" class="small">E+ · excitation +</text><text x="95" y="320" class="small">E− · excitation −</text><text x="95" y="360" class="small">A+ · channel A +</text><text x="95" y="400" class="small">A− · channel A −</text>
  <rect x="335" y="205" width="75" height="250" rx="8" class="dev"/><text x="372" y="240" text-anchor="middle" class="small">HX711</text><text x="372" y="280" text-anchor="middle" class="tiny">E+</text><text x="372" y="320" text-anchor="middle" class="tiny">E−</text><text x="372" y="360" text-anchor="middle" class="tiny">A+</text><text x="372" y="400" text-anchor="middle" class="tiny">A−</text>
  <path d="M295 280 H335" class="pwr"/><path d="M295 320 H335" class="gnd"/><path d="M295 360 H335" class="wire"/><path d="M295 400 H335" class="wire"/>
  <path d="M410 280 H420 V265" class="wire"/><path d="M410 320 H420 V305" class="wire"/><text x="300" y="482" class="tiny">Confirm load-cell wire color code; it varies.</text>
  <rect x="790" y="190" width="260" height="110" rx="10" class="dev"/><text x="920" y="225" text-anchor="middle" class="label">SHT31 module</text><text x="920" y="253" text-anchor="middle" class="small">SDA → GPIO21 · SCL → GPIO22</text><text x="920" y="278" text-anchor="middle" class="small">3V3 · GND</text>
  <path d="M730 365 H760 V253 H790" class="wire"/><path d="M730 405 H775 V267 H790" class="wire"/><path d="M730 510 H770 V290 H790" class="pwr"/><path d="M730 522 H780 V300 H790" class="gnd"/>
  <text x="70" y="525" class="small">HX711 digital: DOUT → GPIO32 · SCK → GPIO33</text>
  <rect x="790" y="350" width="260" height="275" rx="10" class="warn"/><text x="920" y="382" text-anchor="middle" class="label">Battery divider</text><text x="920" y="410" text-anchor="middle" class="small">single cell ≤ 4.2 V only</text>
  <text x="815" y="450" class="small">Battery +</text><path d="M875 445 H920" class="pwr"/><rect x="920" y="430" width="70" height="38" rx="4" class="dev"/><text x="955" y="455" text-anchor="middle" class="small">100 kΩ</text>
  <circle cx="1020" cy="487" r="5" fill="#246b9a"/><path d="M990 449 H1020 V487 H730 V470" class="wire"/><text x="1028" y="493" class="tiny">midpoint → ADC34</text>
  <path d="M1020 487 V520" class="wire"/><rect x="985" y="520" width="70" height="38" rx="4" class="dev"/><text x="1020" y="545" text-anchor="middle" class="small">100 kΩ</text><path d="M1020 558 V590 H875" class="gnd"/><text x="815" y="595" class="small">Battery − / GND</text>
  <text x="790" y="650" class="small">Divider ratio 2.0. Other pack voltages require recalculating hardware and firmware.</text><text x="790" y="674" class="small">Keep ADC34 within the board's allowed input range.</text>
  <text x="40" y="720" class="small">Share low-voltage logic ground where required; power each module within its rated supply range.</text>
</svg>
