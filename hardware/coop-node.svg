<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="560" viewBox="0 0 1020 560" role="img" aria-labelledby="title desc">
  <title id="title">Coop reed contact reference wiring</title>
  <desc id="desc">Generic esp32dev reference for a normally-open reed contact. GPIO27 is pulled up externally to 3V3 through a resistor. The reed switch closes the signal to GND. The optional light sensor is explicitly out of scope. GPIO is 3.3 volt logic.</desc>
  <defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b3a}.title{font-size:27px;font-weight:700}.sub{font-size:16px;fill:#405568}.label{font-size:18px;font-weight:600}.small{font-size:15px}.box{fill:#f5f8fb;stroke:#38536b;stroke-width:2}.dev{fill:#fff;stroke:#54738d;stroke-width:2}.wire{fill:none;stroke:#246b9a;stroke-width:4}.pwr{fill:none;stroke:#b64b35;stroke-width:4}.gnd{fill:none;stroke:#525b63;stroke-width:4}.dash{fill:#f8f8f8;stroke:#858d94;stroke-width:2;stroke-dasharray:8 6}</style></defs>
  <rect width="1020" height="560" fill="#fff"/><text x="40" y="48" class="title">Coop door contact · reference wiring</text><text x="40" y="78" class="sub">Generic esp32dev only · 3.3 V GPIO logic · verify exact board revision before wiring</text>
  <rect x="65" y="190" width="240" height="150" rx="12" class="box"/><text x="185" y="228" text-anchor="middle" class="label">ESP32 dev board</text><text x="185" y="270" text-anchor="middle" class="label">GPIO27</text><text x="185" y="305" text-anchor="middle" class="small">3V3 · GND</text>
  <circle cx="465" cy="255" r="6" fill="#246b9a"/><path d="M305 270 H465" class="wire"/><text x="340" y="255" class="small">GPIO27 signal node</text>
  <path d="M465 255 V150 H550" class="pwr"/><text x="480" y="138" class="small">3V3</text><rect x="550" y="125" width="130" height="52" rx="6" class="dev"/><text x="615" y="158" text-anchor="middle" class="small">external pull-up</text><path d="M680 151 H770 V255" class="pwr"/>
  <rect x="770" y="210" width="185" height="95" rx="10" class="dev"/><text x="862" y="242" text-anchor="middle" class="label">Normally-open</text><text x="862" y="269" text-anchor="middle" class="small">reed contact</text><path d="M465 255 H770" class="wire"/><path d="M862 305 V400 H700" class="gnd"/><text x="710" y="425" class="small">GND</text><text x="495" y="293" class="small">closed contact pulls GPIO27 to GND</text>
  <rect x="65" y="390" width="450" height="95" rx="10" class="dash"/><text x="290" y="430" text-anchor="middle" class="label">Optional light sensor: OUT OF SCOPE</text><text x="290" y="458" text-anchor="middle" class="small">No connection or pin assignment shown</text>
  <text x="40" y="530" class="small">Use an external pull-up to 3V3; do not apply higher voltage to GPIO27. Logic ground is the switch return.</text>
</svg>
