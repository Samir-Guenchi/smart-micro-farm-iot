<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="560" viewBox="0 0 1020 560" role="img" aria-labelledby="title desc">
  <title id="title">Coop reed contact reference wiring</title>
  <desc id="desc">Generic esp32dev reference. ESP32 3V3 connects through an external 10 kilo-ohm pull-up resistor to the GPIO27 signal node. GPIO27 connects continuously to that same node. A normally-open reed switch connects the node to GND, with GND returning to ESP32 ground. Optional light sensing is out of scope.</desc>
  <defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b3a}.title{font-size:27px;font-weight:700}.sub{font-size:16px;fill:#405568}.label{font-size:18px;font-weight:600}.small{font-size:15px}.tiny{font-size:13px}.box{fill:#f5f8fb;stroke:#38536b;stroke-width:2}.dev{fill:#fff;stroke:#54738d;stroke-width:2}.wire{fill:none;stroke:#246b9a;stroke-width:4}.pwr{fill:none;stroke:#b64b35;stroke-width:4}.gnd{fill:none;stroke:#525b63;stroke-width:4}.dash{fill:#f8f8f8;stroke:#858d94;stroke-width:2;stroke-dasharray:8 6}</style></defs>
  <rect width="1020" height="560" fill="#fff"/><text x="40" y="48" class="title">Coop door contact · reference wiring</text><text x="40" y="78" class="sub">Generic esp32dev only · 3.3 V GPIO logic · verify exact board revision before wiring</text>
  <rect x="55" y="175" width="250" height="185" rx="12" class="box"/><text x="180" y="215" text-anchor="middle" class="label">ESP32 dev board</text><text x="80" y="270" class="small">GPIO27</text><text x="80" y="330" class="small">3V3</text><text x="205" y="330" class="small">GND</text>
  <path d="M305 260 H455" class="wire"/><circle cx="455" cy="260" r="6" fill="#246b9a"/><text x="330" y="245" class="small">GPIO27 to signal node</text>
  <path d="M160 330 V125 H530" class="pwr"/><text x="75" y="130" class="small">ESP32 3V3</text>
  <polyline points="530,125 540,115 550,135 560,115 570,135 580,115 590,135 600,125" class="pwr"/><path d="M600 125 H700 V260 H455" class="pwr"/><rect x="520" y="82" width="120" height="24" rx="5" class="dev"/><text x="580" y="99" text-anchor="middle" class="tiny">10 kΩ pull-up</text>
  <rect x="700" y="215" width="230" height="95" rx="10" class="dev"/><text x="815" y="250" text-anchor="middle" class="label">Normally-open</text><text x="815" y="280" text-anchor="middle" class="small">reed contact</text>
  <path d="M455 260 H700" class="wire"/><path d="M930 260 V390 H250 V330" class="gnd"/><text x="700" y="420" class="small">Contact closes node to GND; return to ESP32 GND</text>
  <rect x="55" y="405" width="510" height="90" rx="10" class="dash"/><text x="310" y="445" text-anchor="middle" class="label">Optional light sensor: OUT OF SCOPE</text><text x="310" y="473" text-anchor="middle" class="small">No connection or pin assignment shown</text>
  <text x="40" y="535" class="small">Use 3V3 only; do not apply higher voltage to GPIO27. The pull-up and switch use the shared logic ground.</text>
</svg>
